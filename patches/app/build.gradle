plugins {
    id 'com.android.application'
}

def buildWithCMake = true

android {
    namespace = "com.zun.th07"
    compileSdkVersion 35
    ndkVersion = "28.2.13676358"

    signingConfigs {
        v2dev {
            storeFile file('th07-v2-dev.keystore')
            storePassword 'th07android'
            keyAlias 'th07v2'
            keyPassword 'th07android'
        }
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 2
        versionName "2.0"
        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-21"
                abiFilters 'arm64-v8a'
            }
            cmake {
                if (project.hasProperty('TH_EXTERNAL_ASSETS')) {
                    arguments "-DANDROID_PLATFORM=android-21", "-DANDROID_STL=c++_static", "-DTH_EXTERNAL_ASSETS=ON"
                } else {
                    arguments "-DANDROID_PLATFORM=android-21", "-DANDROID_STL=c++_static"
                }
                abiFilters 'arm64-v8a'
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.v2dev
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.v2dev
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }

    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
            if (!project.hasProperty('TH_EXTERNAL_ASSETS')) {
                assets.srcDirs = ['../../assets']
            }
        }
        externalNativeBuild {
            if (buildWithCMake) {
                cmake {
                    path '../../CMakeLists.txt'
                }
            } else {
                ndkBuild {
                    path 'jni/Android.mk'
                }
            }
        }
    }

    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
